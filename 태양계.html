<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>태양계 공전 및 자전 3D 시뮬레이션</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js 라이브러리 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Google Fonts: Noto Sans KR & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #03050a;
            font-family: 'Noto Sans KR', 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        #canvas-container:active {
            cursor: grabbing;
        }
        /* 천체 이름 라벨 스타일 */
        .planet-label {
            position: absolute;
            transform: translate(-50%, -140%);
            pointer-events: auto;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9), 0 0 10px rgba(0, 0, 0, 0.8);
            white-space: nowrap;
        }
        .planet-label:hover {
            transform: translate(-50%, -150%) scale(1.1);
            z-index: 30;
        }
        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.6);
            border-radius: 3px;
        }
        /* 글래스모피즘 패널 효과 */
        .glass-panel {
            background: rgba(11, 16, 30, 0.78);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }
        /* 레인지 슬라이더 커스텀 */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.8);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(148, 163, 184, 0.3);
            border-radius: 2px;
        }
    </style>
</head>
<body class="text-slate-100">

    <!-- 3D 캔버스 및 라벨 컨테이너 -->
    <div id="canvas-container">

    </div>

    <!-- 상단 헤더 및 빠른 천체 선택 바 -->

        <div class="glass-panel rounded-2xl px-4 py-2.5 pointer-events-auto flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-amber-400 animate-pulse shadow-[0_0_12px_#fbbf24]"></div>
            <div>
                <h1 class="text-base sm:text-lg font-bold tracking-tight bg-gradient-to-r from-amber-200 via-sky-200 to-indigo-300 bg-clip-text text-transparent">
                    태양계 공전 · 자전 시뮬레이터
                </h1>
                <p class="text-[11px] text-slate-400 hidden sm:block">드래그: 시점 회전 · 휠/핀치: 확대/축소 · 천체 클릭: 상세 정보 및 추적</p>
            </div>
        </div>

        <!-- 빠른 천체 선택 버튼 목록 (수금지화목토천해명) -->
        <div class="glass-panel rounded-2xl p-1.5 pointer-events-auto max-w-full overflow-x-auto flex items-center gap-1" id="quick-nav">
            <!-- JS로 버튼 동적 생성 -->
        </div>
    </header>

    <!-- 천체 상세 정보 카드 (클릭 시 표시) -->

        <div class="flex justify-between items-start mb-3">
            <div class="flex items-center gap-2.5">

                    <span id="info-en-name" class="text-xs text-slate-400 font-medium">Earth · 암석 행성</span>
                </div>
            </div>
            <button id="close-info-btn" class="text-slate-400 hover:text-white p-1.5 rounded-lg hover:bg-slate-800/60 transition" aria-label="닫기">

            </button>
        </div>

        <div class="grid grid-cols-2 gap-2.5 my-3 text-xs">
            <div class="bg-slate-900/70 rounded-xl p-2.5 border border-slate-700/50">
                <div class="text-slate-400 mb-0.5">공전 주기 (태양 주위)</div>
                <div id="info-orbit" class="font-semibold text-sky-300 text-sm">365.25일</div>
            </div>
            <div class="bg-slate-900/70 rounded-xl p-2.5 border border-slate-700/50">
                <div class="text-slate-400 mb-0.5">자전 주기 (제자리 회전)</div>
                <div id="info-rotation" class="font-semibold text-amber-300 text-sm">23시간 56분</div>
            </div>
            <div class="bg-slate-900/70 rounded-xl p-2.5 border border-slate-700/50">
                <div class="text-slate-400 mb-0.5">자전축 기울기</div>
                <div id="info-tilt" class="font-semibold text-emerald-300 text-sm">23.4°</div>
            </div>
            <div class="bg-slate-900/70 rounded-xl p-2.5 border border-slate-700/50">
                <div class="text-slate-400 mb-0.5">자전 방향</div>
                <div id="info-direction" class="font-semibold text-indigo-300 text-sm">반시계 (순행)</div>
            </div>
        </div>

        <p id="info-desc" class="text-xs sm:text-sm text-slate-300 leading-relaxed mb-4">

                전체 보기
            </button>
        </div>
    </aside>

    <!-- 하단 컨트롤 패널 -->
    <footer class="fixed bottom-3 sm:bottom-5 left-1/2 -translate-x-1/2 z-20 w-[calc(100%-1.5rem)] max-w-4xl glass-panel rounded-2xl p-3 sm:px-5 sm:py-3.5">
        <div class="flex flex-wrap items-center justify-between gap-3">

            <div class="flex items-center gap-2">
                <button id="play-pause-btn" class="flex items-center gap-1.5 bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold px-3.5 py-2 rounded-xl text-xs sm:text-sm transition shadow-md">

                    <span id="play-text">일시정지</span>
                </button>

                <button id="view-toggle-btn" class="flex items-center gap-1.5 bg-slate-800/90 hover:bg-slate-700 text-slate-100 font-medium px-3 py-2 rounded-xl text-xs sm:text-sm border border-slate-700 transition">
                    <span id="view-icon">🌐</span>
                    <span id="view-text">2D 평면뷰</span>
                </button>
            </div>

            </div>

            <div class="flex items-center gap-1.5 sm:gap-2 ml-auto sm:ml-0">

                    궤도 ON
                </button>
                <button id="toggle-labels-btn" class="px-2.5 py-1.5 rounded-xl text-xs font-medium bg-indigo-500/20 text-indigo-300 border border-indigo-500/40 transition">

                </button>
                <button id="toggle-axes-btn" class="px-2.5 py-1.5 rounded-xl text-xs font-medium bg-indigo-500/20 text-indigo-300 border border-indigo-500/40 transition" title="자전축 및 적도 마커 표시">

                </button>
                <div class="hidden md:flex items-center gap-1 ml-1 border-l border-slate-700 pl-2">

                    <button id="zoom-out-btn" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold flex items-center justify-center border border-slate-700" title="축소">−</button>
                </div>
            </div>

        </div>
    </footer>

        let scene, camera, renderer;
        let planetObjects = {}; // id -> { group, orbitPivot, mesh, axisLine, labelEl, data, angle, moonPivot }
        let orbitLines = [];
        let isPlaying = true;
        let speedMultiplier = 1.0;
        let is2DView = false;
        let showOrbits = true;
        let showLabels = true;
        let showAxes = true;
        let selectedPlanetId = null;
        let focusedPlanetId = null;

        // 카메라 제어 변수 (구면 좌표계)
        let camTheta = 0.6;      // 수평 회전각
        let camPhi = 1.05;       // 수직 각도 (0: 위, PI/2: 수평)
        let camRadius = 115;     // 카메라 거리
        let targetCamTheta = 0.6;
        let targetCamPhi = 1.05;
        let targetCamRadius = 115;
        let camLookAt = new THREE.Vector3(0, 0, 0);
        let targetCamLookAt = new THREE.Vector3(0, 0, 0);

        // 마우스/터치 인터랙션 상태
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let dragMoved = false;
        let initialPinchDist = null;

        // 2. 절차적 텍스처 생성기 (외부 이미지 없이 고품질 행성 표면 및 자전 시각 패턴 생성)
        function createPlanetTexture(type, baseColorHex) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // 기본 배경 채우기
            ctx.fillStyle = baseColorHex;
            ctx.fillRect(0, 0, 512, 256);

            if (type === 'sun') {
                const grad = ctx.createRadialGradient(256, 128, 20, 256, 128, 260);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.4, '#fde047');
                grad.addColorStop(0.8, '#f59e0b');
                grad.addColorStop(1, '#ea580c');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 512, 256);
                // 태양 흑점 및 플라즈마 무늬 (자전 확인용)
                for (let i = 0; i < 60; i++) {
                    ctx.fillStyle = i % 2 === 0 ? 'rgba(255, 255, 255, 0.25)' : 'rgba(180, 40, 0, 0.25)';
                    ctx.beginPath();
                    ctx.arc(Math.random() * 512, Math.random() * 256, 4 + Math.random() * 14, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else if (type === 'earth') {
                // 푸른 바다
                ctx.fillStyle = '#0284c7';
                ctx.fillRect(0, 0, 512, 256);
                // 대륙 패턴 (자전이 명확히 보이도록 배치)
                ctx.fillStyle = '#22c55e';
                const continents = [
                    [90, 90, 45, 35], [130, 140, 30, 45], [260, 75, 55, 35],
                    [290, 130, 35, 50], [390, 105, 50, 40], [430, 165, 28, 22]
                ];
                continents.forEach(([x, y, rx, ry]) => {
                    ctx.beginPath();
                    ctx.ellipse(x, y, rx, ry, 0.3, 0, Math.PI * 2);
                    ctx.fill();
                });
                // 구름 띠
                ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
                for (let i = 0; i < 18; i++) {
                    ctx.fillRect((i * 47) % 512, 30 + (i * 19) % 190, 65, 7);
                }
                // 남극/북극 빙하
                ctx.fillStyle = '#f8fafc';
                ctx.fillRect(0, 0, 512, 22);
                ctx.fillRect(0, 234, 512, 22);
            } else if (type === 'jupiter') {
                // 목성 줄무늬 및 대적점
                const bands = ['#d97706', '#fef3c7', '#b45309', '#fde68a', '#92400e', '#fed7aa', '#b45309', '#fef3c7'];
                const bandH = 256 / bands.length;
                bands.forEach((c, idx) => {
                    ctx.fillStyle = c;
                    ctx.fillRect(0, idx * bandH, 512, bandH + 1);
                });
                // 대적점 (자전 관찰 핵심 포인트)
                ctx.fillStyle = '#dc2626';
                ctx.beginPath();
                ctx.ellipse(220, 165, 34, 20, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#fef08a';
                ctx.lineWidth = 3;
                ctx.stroke();
            } else if (type === 'saturn') {
                const bands = ['#fde68a', '#eab308', '#fef08a', '#ca8a04', '#fef9c3', '#d97706'];
                const bandH = 256 / bands.length;
                bands.forEach((c, idx) => {
                    ctx.fillStyle = c;
                    ctx.fillRect(0, idx * bandH, 512, bandH + 1);
                });
            } else if (type === 'mars') {
                ctx.fillStyle = '#dc2626';
                ctx.fillRect(0, 0, 512, 256);
                ctx.fillStyle = '#7f1d1d';
                for (let i = 0; i < 14; i++) {
                    ctx.beginPath();
                    ctx.ellipse((i * 67) % 512, 50 + (i * 31) % 150, 35, 18, 0.2, 0, Math.PI * 2);
                    ctx.fill();
                }
                // 극관
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 512, 18);
                ctx.fillRect(0, 238, 512, 18);
            } else if (type === 'venus') {
                const bands = ['#fde047', '#facc15', '#fef08a', '#eab308'];
                bands.forEach((c, idx) => {
                    ctx.fillStyle = c;
                    ctx.fillRect(0, idx * 64, 512, 65);
                });
                ctx.fillStyle = 'rgba(255,255,255,0.25)';
                ctx.beginPath();
                ctx.arc(180, 128, 45, 0, Math.PI * 2);
                ctx.fill();
            } else if (type === 'uranus' || type === 'neptune') {
                ctx.fillStyle = baseColorHex;
                ctx.fillRect(0, 0, 512, 256);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
                ctx.fillRect(0, 60, 512, 18);
                ctx.fillRect(0, 175, 512, 14);
                // 대암점/폭풍 마커
                ctx.fillStyle = type === 'neptune' ? '#1d4ed8' : '#0891b2';
                ctx.beginPath();
                ctx.ellipse(250, 130, 28, 16, 0, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // 수성, 명왕성 등 암석/얼음 표면 크레이터
                for (let i = 0; i < 35; i++) {
                    ctx.fillStyle = i % 2 === 0 ? 'rgba(0,0,0,0.25)' : 'rgba(255,255,255,0.2)';
                    ctx.beginPath();
                    ctx.arc((i * 73) % 512, (i * 41) % 256, 6 + (i % 14), 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // 모든 천체에 은은한 경도선(자오선) 1줄을 추가하여 자전 움직임을 명확히 인지할 수 있게 함
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(256, 0);
            ctx.lineTo(256, 256);
            ctx.stroke();

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        // 3. 태양 코로나 글로우 스프라이트 생성
        function createSunGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(128, 128, 15, 128, 128, 128);
            grad.addColorStop(0, 'rgba(255, 250, 210, 1)');
            grad.addColorStop(0.25, 'rgba(253, 224, 71, 0.85)');
            grad.addColorStop(0.55, 'rgba(245, 158, 11, 0.35)');
            grad.addColorStop(1, 'rgba(234, 88, 12, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 256, 256);
            return new THREE.CanvasTexture(canvas);
        }

        // 4. 배경 별빛(은하수 & 성단) 생성
        function createStarfield() {
            const starGeo = new THREE.BufferGeometry();
            const starCount = 3500;
            const positions = new Float32Array(starCount * 3);
            const colors = new Float32Array(starCount * 3);

            const starColors = [
                new THREE.Color('#ffffff'),
                new THREE.Color('#bae6fd'),
                new THREE.Color('#fef08a'),
                new THREE.Color('#ddd6fe')
            ];

            for (let i = 0; i < starCount; i++) {
                const r = 280 + Math.random() * 450;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);

                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.cos(phi);
                positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);

                const col = starColors[Math.floor(Math.random() * starColors.length)];
                colors[i * 3] = col.r;
                colors[i * 3 + 1] = col.g;
                colors[i * 3 + 2] = col.b;
            }

            starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            starGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const starMat = new THREE.PointsMaterial({
                size: 1.5,
                vertexColors: true,
                transparent: true,
                opacity: 0.85
            });

            const stars = new THREE.Points(starGeo, starMat);
            scene.add(stars);
        }

        // 5. 초기화 및 씬 구축
        function init() {
            const container = document.getElementById('canvas-container');

            // 씬 및 카메라 설정
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x03050a, 0.0012);

            camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 1500);
            updateCameraPosition(true);

            // 렌더러 설정
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // 조명 설정 (태양 중심 광원 + 전체 은은한 환경광)
            const ambientLight = new THREE.AmbientLight(0x475569, 0.9);
            scene.add(ambientLight);

            const sunLight = new THREE.PointLight(0xfffbeb, 2.4, 400);
            sunLight.position.set(0, 0, 0);
            scene.add(sunLight);

            // 배경 별빛 생성
            createStarfield();

            // 빠른 내비게이션 바 및 천체 생성
            const quickNav = document.getElementById('quick-nav');
            const labelsContainer = document.getElementById('labels-container');

            CELESTIAL_DATA.forEach((data, index) => {
                // 5-1. 빠른 선택 버튼 생성
                const btn = document.createElement('button');
                btn.className = 'px-2.5 py-1 rounded-xl text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800/80 transition flex items-center gap-1.5 whitespace-nowrap';
                btn.innerHTML = `<span class="w-2 h-2 rounded-full" style="background-color:${data.color}"></span>${data.name}`;
                btn.onclick = () => selectPlanet(data.id, true);
                quickNav.appendChild(btn);

                // 5-2. 궤도 기울기 그룹 (명왕성 등 궤도면 기울기 반영)
                const orbitPlaneGroup = new THREE.Group();
                orbitPlaneGroup.rotation.z = THREE.MathUtils.degToRad(data.orbitInclination);
                orbitPlaneGroup.rotation.x = THREE.MathUtils.degToRad(data.orbitInclination * 0.4);
                scene.add(orbitPlaneGroup);

                // 5-3. 공전 궤도선 그리기 (태양 제외)
                if (data.distance > 0) {
                    const curvePoints = [];
                    const segments = 128;
                    const a = data.distance;
                    const b = data.distance * (1 - data.eccentricity * 0.6);
                    const focusOffset = data.distance * data.eccentricity * 1.4;

                    for (let i = 0; i <= segments; i++) {
                        const theta = (i / segments) * Math.PI * 2;
                        const x = Math.cos(theta) * a - focusOffset;
                        const z = Math.sin(theta) * b;
                        curvePoints.push(new THREE.Vector3(x, 0, z));
                    }

                    const orbitGeo = new THREE.BufferGeometry().setFromPoints(curvePoints);
                    const orbitMat = new THREE.LineBasicMaterial({
                        color: data.id === 'pluto' ? 0xa855f7 : 0x38bdf8,
                        transparent: true,
                        opacity: data.id === 'pluto' ? 0.35 : 0.24
                    });
                    const orbitLine = new THREE.Line(orbitGeo, orbitMat);
                    orbitPlaneGroup.add(orbitLine);
                    orbitLines.push(orbitLine);
                }

                // 5-4. 천체 컨테이너 (공전 위치 이동용)
                const bodyContainer = new THREE.Group();
                orbitPlaneGroup.add(bodyContainer);

                // 5-5. 자전축 기울기 그룹
                const tiltGroup = new THREE.Group();
                tiltGroup.rotation.z = THREE.MathUtils.degToRad(data.axialTilt);
                bodyContainer.add(tiltGroup);

                // 5-6. 천체 메시 생성
                const geometry = new THREE.SphereGeometry(data.radius, 36, 36);
                const texture = createPlanetTexture(data.textureType, data.color);
                const material = data.id === 'sun'
                    ? new THREE.MeshBasicMaterial({ map: texture })
                    : new THREE.MeshStandardMaterial({
                        map: texture,
                        roughness: 0.72,
                        metalness: 0.1
                    });

                const mesh = new THREE.Mesh(geometry, material);
                mesh.userData = { planetId: data.id };
                tiltGroup.add(mesh);

                // 태양 코로나 글로우 추가
                if (data.id === 'sun') {
                    const spriteMat = new THREE.SpriteMaterial({
                        map: createSunGlowTexture(),
                        color: 0xffdd77,
                        transparent: true,
                        blending: THREE.AdditiveBlending
                    });
                    const glowSprite = new THREE.Sprite(spriteMat);
                    glowSprite.scale.set(34, 34, 1);
                    mesh.add(glowSprite);
                }

                // 지구 대기권 글로우 추가
                if (data.id === 'earth') {
                    const atmoGeo = new THREE.SphereGeometry(data.radius * 1.07, 32, 32);
                    const atmoMat = new THREE.MeshBasicMaterial({
                        color: 0x38bdf8,
                        transparent: true,
                        opacity: 0.22,
                        side: THREE.BackSide
                    });
                    const atmoMesh = new THREE.Mesh(atmoGeo, atmoMat);
                    tiltGroup.add(atmoMesh);
                }

                // 토성 및 천왕성 고리 추가
                if (data.hasRing) {
                    const ringGeo = new THREE.RingGeometry(data.ringInner, data.ringOuter, 64);
                    // UV 좌표 매핑 (동심원 줄무늬 표현)
                    const pos = ringGeo.attributes.position;
                    const v3 = new THREE.Vector3();
                    for (let i = 0; i < pos.count; i++) {
                        v3.fromBufferAttribute(pos, i);
                        const dist = v3.length();
                        const norm = (dist - data.ringInner) / (data.ringOuter - data.ringInner);
                        ringGeo.attributes.uv.setXY(i, norm, 0.5);
                    }

                    const ringMat = new THREE.MeshStandardMaterial({
                        color: data.ringColor,
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: data.id === 'saturn' ? 0.82 : 0.45,
                        roughness: 0.6
                    });
                    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                    ringMesh.rotation.x = Math.PI / 2;
                    tiltGroup.add(ringMesh);
                }

                // 자전축 막대 표시 (자전축 기울기와 자전 방향 직관화)
                const axisLength = data.radius * 1.85;
                const axisPoints = [
                    new THREE.Vector3(0, -axisLength, 0),
                    new THREE.Vector3(0, axisLength, 0)
                ];
                const axisGeo = new THREE.BufferGeometry().setFromPoints(axisPoints);
                const axisMat = new THREE.LineBasicMaterial({
                    color: data.rotationSpeed < 0 ? 0xf43f5e : 0x38bdf8, // 역행 자전은 붉은빛 축
                    transparent: true,
                    opacity: 0.75
                });
                const axisLine = new THREE.Line(axisGeo, axisMat);
                tiltGroup.add(axisLine);

                // 지구 위성(달) 추가
                let moonPivot = null;
                if (data.hasMoon) {
                    moonPivot = new THREE.Group();
                    bodyContainer.add(moonPivot);
                    const moonGeo = new THREE.SphereGeometry(0.45, 16, 16);
                    const moonMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.9 });
                    const moonMesh = new THREE.Mesh(moonGeo, moonMat);
                    moonMesh.position.set(3.4, 0.3, 0);
                    moonPivot.add(moonMesh);
                }

                // 5-7. HTML 오버레이 라벨 생성
                const labelEl = document.createElement('div');
                labelEl.className = 'planet-label px-2 py-0.5 rounded-full bg-slate-950/65 border border-slate-700/60 text-[11px] sm:text-xs font-semibold flex items-center gap-1';
                labelEl.innerHTML = `<span class="w-1.5 h-1.5 rounded-full" style="background:${data.color}"></span><span>${data.name}</span>`;
                labelEl.onclick = (e) => {
                    e.stopPropagation();
                    selectPlanet(data.id, true);
                };
                labelsContainer.appendChild(labelEl);

                // 초기 공전 각도 분산 배치
                const initialAngle = index * 0.85;

                planetObjects[data.id] = {
                    data,
                    bodyContainer,
                    tiltGroup,
                    mesh,
                    axisLine,
                    labelEl,
                    moonPivot,
                    angle: initialAngle
                };
            });

            setupEventListeners();
            animate();
        }

        // 6. 카메라 위치 업데이트 (부드러운 보간)
        function updateCameraPosition(instant = false) {
            const lerpFactor = instant ? 1 : 0.08;
            camTheta += (targetCamTheta - camTheta) * lerpFactor;
            camPhi += (targetCamPhi - camPhi) * lerpFactor;
            camRadius += (targetCamRadius - camRadius) * lerpFactor;

            // 추적 중인 행성이 있으면 해당 위치를 바라봄
            if (focusedPlanetId && planetObjects[focusedPlanetId]) {
                const worldPos = new THREE.Vector3();
                planetObjects[focusedPlanetId].bodyContainer.getWorldPosition(worldPos);
                targetCamLookAt.copy(worldPos);
            } else {
                targetCamLookAt.set(0, 0, 0);
            }

            camLookAt.lerp(targetCamLookAt, lerpFactor);

            const x = camLookAt.x + camRadius * Math.sin(camPhi) * Math.cos(camTheta);
            const y = camLookAt.y + camRadius * Math.cos(camPhi);
            const z = camLookAt.z + camRadius * Math.sin(camPhi) * Math.sin(camTheta);

            camera.position.set(x, y, z);
            camera.lookAt(camLookAt);
        }

        // 7. 천체 선택 및 정보 카드 표시
        function selectPlanet(id, shouldFocus = false) {
            const obj = planetObjects[id];
            if (!obj) return;

            selectedPlanetId = id;
            const d = obj.data;

            document.getElementById('info-color-dot').style.backgroundColor = d.color;
            document.getElementById('info-name').textContent = d.name;
            document.getElementById('info-en-name').textContent = d.enName;
            document.getElementById('info-orbit').textContent = d.orbitPeriod;
            document.getElementById('info-rotation').textContent = d.rotationPeriod;
            document.getElementById('info-tilt').textContent = `${d.axialTilt}°`;
            document.getElementById('info-direction').textContent = d.direction;
            document.getElementById('info-desc').textContent = d.description;

            const card = document.getElementById('info-card');
            card.classList.remove('translate-x-[120%]', 'opacity-0');
            card.classList.add('translate-x-0', 'opacity-100');

            if (shouldFocus) {
                focusOnPlanet(id);
            }
        }

        function focusOnPlanet(id) {
            focusedPlanetId = id;
            const d = planetObjects[id].data;
            targetCamRadius = Math.max(d.radius * 5.5, 11);
            if (is2DView) {
                is2DView = false;
                updateViewToggleButton();
                targetCamPhi = 1.1;
            }
        }

        function resetCameraFocus() {
            focusedPlanetId = null;
            targetCamRadius = 115;
            targetCamPhi = is2DView ? 0.05 : 1.05;
        }

        function updateViewToggleButton() {
            const icon = document.getElementById('view-icon');
            const text = document.getElementById('view-text');
            if (is2DView) {
                icon.textContent = '🛰️';
                text.textContent = '3D 입체뷰';
            } else {
                icon.textContent = '🌐';
                text.textContent = '2D 평면뷰';
            }
        }

        // 8. 이벤트 리스너 설정 (마우스, 터치, 버튼 UI)
        function setupEventListeners() {
            const container = document.getElementById('canvas-container');
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            // 캔버스 클릭으로 3D 천체 직접 선택
            function handleCanvasClick(clientX, clientY) {
                if (dragMoved) return;
                mouse.x = (clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const meshes = Object.values(planetObjects).map(p => p.mesh);
                const intersects = raycaster.intersectObjects(meshes);

                if (intersects.length > 0) {
                    const hitId = intersects[0].object.userData.planetId;
                    if (hitId) selectPlanet(hitId, true);
                }
            }

            // 마우스 드래그 회전
            container.addEventListener('mousedown', (e) => {
                isDragging = true;
                dragMoved = false;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - dragStartX;
                const dy = e.clientY - dragStartY;
                if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragMoved = true;

                targetCamTheta -= dx * 0.006;
                targetCamPhi = Math.max(0.05, Math.min(Math.PI - 0.05, targetCamPhi - dy * 0.006));

                dragStartX = e.clientX;
                dragStartY = e.clientY;
            });

            window.addEventListener('mouseup', (e) => {
                if (isDragging) {
                    handleCanvasClick(e.clientX, e.clientY);
                }
                isDragging = false;
            });

            // 마우스 휠 줌
            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                targetCamRadius = Math.max(6, Math.min(260, targetCamRadius + e.deltaY * 0.08));
            }, { passive: false });

            // 모바일 터치 드래그 및 핀치 줌
            container.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    dragMoved = false;
                    dragStartX = e.touches[0].clientX;
                    dragStartY = e.touches[0].clientY;
                } else if (e.touches.length === 2) {
                    isDragging = false;
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    initialPinchDist = Math.hypot(dx, dy);
                }
            }, { passive: true });

            container.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1 && isDragging) {
                    const dx = e.touches[0].clientX - dragStartX;
                    const dy = e.touches[0].clientY - dragStartY;
                    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) dragMoved = true;

                    targetCamTheta -= dx * 0.008;
                    targetCamPhi = Math.max(0.05, Math.min(Math.PI - 0.05, targetCamPhi - dy * 0.008));

                    dragStartX = e.touches[0].clientX;
                    dragStartY = e.touches[0].clientY;
                } else if (e.touches.length === 2 && initialPinchDist) {
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    const dist = Math.hypot(dx, dy);
                    const delta = initialPinchDist - dist;
                    targetCamRadius = Math.max(6, Math.min(260, targetCamRadius + delta * 0.25));
                    initialPinchDist = dist;
                }
            }, { passive: true });

            container.addEventListener('touchend', (e) => {
                if (isDragging && e.changedTouches.length > 0) {
                    handleCanvasClick(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
                }
                isDragging = false;
                initialPinchDist = null;
            });

            // UI 컨트롤 버튼 이벤트
            document.getElementById('play-pause-btn').addEventListener('click', () => {
                isPlaying = !isPlaying;
                document.getElementById('play-icon').textContent = isPlaying ? '⏸' : '▶️';
                document.getElementById('play-text').textContent = isPlaying ? '일시정지' : '재생';
            });

            document.getElementById('view-toggle-btn').addEventListener('click', () => {
                is2DView = !is2DView;
                updateViewToggleButton();
                if (is2DView) {
                    focusedPlanetId = null;
                    targetCamPhi = 0.04; // 거의 수직 위에서 내려다보는 2D 평면뷰
                    targetCamRadius = 135;
                } else {
                    targetCamPhi = 1.05; // 입체 3D 뷰
                    targetCamRadius = 115;
                }
            });

            const speedSlider = document.getElementById('speed-slider');
            const speedValue = document.getElementById('speed-value');
            speedSlider.addEventListener('input', (e) => {
                speedMultiplier = parseFloat(e.target.value);
                speedValue.textContent = `${speedMultiplier.toFixed(1)}x`;
            });

            document.getElementById('toggle-orbits-btn').addEventListener('click', (e) => {
                showOrbits = !showOrbits;
                orbitLines.forEach(line => line.visible = showOrbits);
                e.target.textContent = showOrbits ? '궤도 ON' : '궤도 OFF';
                e.target.classList.toggle('opacity-50', !showOrbits);
            });

            document.getElementById('toggle-labels-btn').addEventListener('click', (e) => {
                showLabels = !showLabels;
                document.getElementById('labels-container').style.display = showLabels ? 'block' : 'none';
                e.target.textContent = showLabels ? '이름 ON' : '이름 OFF';
                e.target.classList.toggle('opacity-50', !showLabels);
            });

            document.getElementById('toggle-axes-btn').addEventListener('click', (e) => {
                showAxes = !showAxes;
                Object.values(planetObjects).forEach(p => {
                    p.axisLine.visible = showAxes;
                });
                e.target.textContent = showAxes ? '자전축 ON' : '자전축 OFF';
                e.target.classList.toggle('opacity-50', !showAxes);
            });

            document.getElementById('zoom-in-btn').addEventListener('click', () => {
                targetCamRadius = Math.max(6, targetCamRadius - 18);
            });

            document.getElementById('zoom-out-btn').addEventListener('click', () => {
                targetCamRadius = Math.min(260, targetCamRadius + 18);
            });

            document.getElementById('close-info-btn').addEventListener('click', () => {
                const card = document.getElementById('info-card');
                card.classList.add('translate-x-[120%]', 'opacity-0');
                card.classList.remove('translate-x-0', 'opacity-100');
            });

            document.getElementById('focus-planet-btn').addEventListener('click', () => {
                if (selectedPlanetId) focusOnPlanet(selectedPlanetId);
            });

            document.getElementById('reset-focus-btn').addEventListener('click', () => {
                resetCameraFocus();
            });

            // 창 크기 변경 대응
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // 9. 메인 애니메이션 루프 (60fps)
        function animate() {
            requestAnimationFrame(animate);

            const deltaScale = isPlaying ? speedMultiplier : 0;
            const tempVec = new THREE.Vector3();

            Object.values(planetObjects).forEach((obj) => {
                const d = obj.data;

                // 자전 (Y축 기준 회전: 양수는 반시계 순행, 음수는 시계 역행)
                obj.mesh.rotation.y += d.rotationSpeed * deltaScale;

                // 공전 (태양 제외)
                if (d.distance > 0) {
                    obj.angle += d.orbitSpeed * deltaScale;
                    const a = d.distance;
                    const b = d.distance * (1 - d.eccentricity * 0.6);
                    const focusOffset = d.distance * d.eccentricity * 1.4;

                    const x = Math.cos(obj.angle) * a - focusOffset;
                    const z = Math.sin(obj.angle) * b;
                    obj.bodyContainer.position.set(x, 0, z);
                }

                // 달 공전 (지구)
                if (obj.moonPivot) {
                    obj.moonPivot.rotation.y += 0.055 * deltaScale;
                }

                // 3D 좌표를 2D 화면 좌표로 투영하여 이름 라벨 업데이트
                if (showLabels) {
                    obj.bodyContainer.getWorldPosition(tempVec);
                    tempVec.y += d.radius * 1.25;
                    tempVec.project(camera);

                    // 카메라 뒤쪽에 있는 경우 숨김
                    if (tempVec.z > 1) {
                        obj.labelEl.style.display = 'none';
                    } else {
                        obj.labelEl.style.display = 'flex';
                        const screenX = (tempVec.x * 0.5 + 0.5) * window.innerWidth;
                        const screenY = (-(tempVec.y * 0.5) + 0.5) * window.innerHeight;
                        obj.labelEl.style.left = `${screenX}px`;
                        obj.labelEl.style.top = `${screenY}px`;
                    }
                }
            });

            updateCameraPosition(false);
            renderer.render(scene, camera);
        }

        // 페이지 로드 완료 후 실행
        window.onload = function () {
            init();
        };
    </script>
</body>
